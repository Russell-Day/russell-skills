name: test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: node --test subagents/code/*.test.mjs
      - run: bash subagents/code/run.test.sh
      - run: python -m pytest -q message-board/scripts/test_board.py
      - run: python -m py_compile go-public/scripts/*.py council/scripts/*.py
