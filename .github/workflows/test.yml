name: test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: node --test skills/subagents/code/*.test.mjs skills/pacing/scripts/*.test.mjs skills/setup/scripts/*.test.mjs
      - run: bash skills/subagents/code/run.test.sh
      - run: python -m pytest -q skills/message-board/scripts/test_board.py
      - run: python -m py_compile skills/go-public/scripts/*.py skills/council/scripts/*.py
